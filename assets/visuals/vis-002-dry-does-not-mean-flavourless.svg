<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Dry does not mean flavourless</title>
  <desc id="desc">Two independent scales show that dryness describes perceived sweetness, while fruit flavour can range from subtle to intense. A wine can therefore be dry and intensely fruity at the same time.</desc>
  <rect width="1200" height="675" rx="24" fill="#fffdf8"/>
  <rect x="1" y="1" width="1198" height="673" rx="23" fill="none" stroke="#171713" stroke-opacity=".16" stroke-width="2"/>

  <text x="64" y="76" fill="#6d1831" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">WINEDADDY QUICK EXPLAINER</text>
  <text x="64" y="142" fill="#171713" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" letter-spacing="-2">Dry does not mean flavourless.</text>
  <text x="64" y="183" fill="#66665e" font-family="Arial, Helvetica, sans-serif" font-size="23">Dryness and fruit flavour describe different parts of the wine experience.</text>

  <rect x="64" y="228" width="516" height="280" rx="18" fill="#f6f0e5"/>
  <text x="96" y="274" fill="#171713" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700">Dryness</text>
  <text x="96" y="308" fill="#66665e" font-family="Arial, Helvetica, sans-serif" font-size="20">How much sweetness do you perceive?</text>
  <line x1="106" y1="388" x2="538" y2="388" stroke="#6d1831" stroke-width="12" stroke-linecap="round"/>
  <circle cx="156" cy="388" r="22" fill="#fffdf8" stroke="#6d1831" stroke-width="8"/>
  <text x="96" y="440" fill="#6d1831" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">DRY</text>
  <text x="466" y="440" fill="#171713" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">SWEET</text>
  <text x="96" y="478" fill="#66665e" font-family="Arial, Helvetica, sans-serif" font-size="18">Little perceptible sweetness</text>

  <rect x="620" y="228" width="516" height="280" rx="18" fill="#171713"/>
  <text x="652" y="274" fill="#fffdf8" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700">Fruit flavour</text>
  <text x="652" y="308" fill="#d8d6cc" font-family="Arial, Helvetica, sans-serif" font-size="20">How strongly do fruit aromas and flavours show?</text>
  <line x1="662" y1="388" x2="1094" y2="388" stroke="#c49348" stroke-width="12" stroke-linecap="round"/>
  <circle cx="1044" cy="388" r="22" fill="#171713" stroke="#c49348" stroke-width="8"/>
  <text x="652" y="440" fill="#fffdf8" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">SUBTLE</text>
  <text x="1008" y="440" fill="#c49348" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">INTENSE</text>
  <text x="652" y="478" fill="#d8d6cc" font-family="Arial, Helvetica, sans-serif" font-size="18">Pronounced fruit character</text>

  <path d="M156 532 C156 574 240 584 322 584 H876 C958 584 1044 574 1044 532" fill="none" stroke="#839276" stroke-width="3" stroke-dasharray="8 8"/>
  <rect x="317" y="548" width="566" height="82" rx="41" fill="#6d1831"/>
  <text x="600" y="582" text-anchor="middle" fill="#fffdf8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="1">BOTH CAN BE TRUE</text>
  <text x="600" y="612" text-anchor="middle" fill="#fffdf8" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700">A wine can be dry and intensely fruity.</text>
</svg>
