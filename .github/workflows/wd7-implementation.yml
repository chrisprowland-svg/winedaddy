name: WD7 autonomous implementation

on:
  workflow_dispatch:
  push:
    branches:
      - 'agent/wd7-*'
      - 'agent/b-*'
      - 'agent/batch-*'
    paths:
      - '.wd7/jobs/*.json'
      - 'wd7-implement.mjs'

concurrency:
  group: wd7-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  implement-and-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deterministic renderer
        run: npm install --no-save --no-package-lock marked
      - name: Implement approved publication package
        run: |
          for job in .wd7/jobs/*.json; do
            node wd7-implement.mjs "$job"
          done
          node wd7-finalize.mjs
          for job in .wd7/jobs/*.json; do
            node wd7-qa.mjs "$job"
          done
          node build-search-index.mjs
      - name: Commit protected preview
        run: |
          git config user.name 'winedaddy-deployment-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add article-source .wd7/results sitemap.xml search-index.json fundamentals/index.html grapes/index.html regions/index.html winemaking/index.html
          for result in .wd7/results/*.json; do
            output_path=$(node -p "JSON.parse(require('fs').readFileSync('$result','utf8')).output_path || JSON.parse(require('fs').readFileSync('$result','utf8')).slug + '/index.html'")
            git add "$output_path"
          done
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
          else
            git commit -m 'Implement WD7 protected preview'
            git push origin HEAD
          fi
