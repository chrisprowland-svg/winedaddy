name: WineDaddy site checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authority-audit
          path: reports/authority-audit.*
          if-no-files-found: warn
          retention-days: 90
      - run: npm test
      - run: npm run worker:check
